rop.over{border-color:var(--blue);background:#eff6ff}.drop .big{font-size:42px;margin-bottom:6px}.drop h3{margin:8px 0 4px;font-size:16px}.drop p{color:var(--muted);font-size:13px}.drop input{display:none}.fileResult{display:none;margin-top:14px}.progress{height:8px;border-radius:8px;background:#e2e8f0;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:var(--blue);transition:.15s}.search{padding:10px 14px;border:1px solid var(--line);border-radius:10px;min-width:240px;outline:none}.search:focus{border-color:var(--blue)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12.5px;font-weight:600;color:#475569;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.field textarea{min-height:90px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.modal.hidden{display:none}.modalBox{background:#fff;border-radius:18px;width:min(920px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.15)}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:#f1f5f9;border:0;border-radius:8px;padding:6px 10px;font-weight:700}.detailGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.score{display:flex;align-items:center;gap:18px}.scoreCircle{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--score),#e2e8f0 0);position:relative}.scoreCircle:after{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#fff}.scoreCircle b{position:relative;z-index:1;font-size:22px;font-weight:800}.preview{width:100%;height:620px;border:1px solid var(--line);border-radius:10px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#0f172a;color:#fff;padding:14px 20px;border-radius:12px;display:none;z-index:60;font-weight:500;box-shadow:0 10px 25px rgba(0,0,0,.2)}.rtl{direction:rtl}.rtl .sidebar{left:auto;right:0}.rtl .main{margin-left:0;margin-right:260px}.rtl .nav button,.rtl th,.rtl td{text-align:right}.rtl .main{text-align:right}.rtl .topbar,.rtl .sectionTitle{direction:rtl}@media(max-width:1050px){.rtl .main{margin-left:0;margin-right:210px}}@media(max-width:720px){.rtl .main{margin:0}}@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}}@media(max-width:720px){.sidebar{position:static;width:100%;height:auto}.bottomNav{position:static;margin-top:10px}.app{display:block}.main{margin:0;width:100%;padding:16px}.grid4,.grid3,.formGrid,.detailGrid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.search{min-width:0;width:100%}}@media print{.sidebar,.topbar,.actions,.noPrint{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none;border:0}}

</head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logoMark">ML</div><div><b>Money Leak</b><small>DETECTOR PRO</small></div></div><nav class="nav"><button data-page="dashboard"><span class="ico">▦</span><span data-i18n="dashboard">Dashboard</span></button><button data-page="import"><span class="ico">⇧</span><span data-i18n="import">Import / Upload</span></button><button data-page="invoices"><span class="ico">▤</span><span data-i18n="invoices">Invoices</span></button><button data-page="customers"><span class="ico">♙</span><span data-i18n="customers">Customers</span></button><button data-page="expenses"><span class="ico">◈</span><span data-i18n="expenses">Expenses</span></button><button data-page="analysis"><span class="ico">◒</span><span data-i18n="analysis">Analysis</span></button><button data-page="reports"><span class="ico">▥</span><span data-i18n="reports">Reports</span></button></nav><div class="bottomNav nav"><button data-page="admin"><span class="ico">⚙</span><span data-i18n="admin">Administration</span></button><button id="langBtn"><span class="ico">文</span><span>العربية / English</span></button></div></aside><main class="main"><div class="topbar"><div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Find unpaid invoices, overdue amounts and financial leakage opportunities.</p></div><div class="actions noPrint"><button class="btn" onclick="showPage('import')">＋ <span data-i18n="uploadFile">Upload File</span></button><button class="btn light" onclick="openInvoiceForm()">＋ <span data-i18n="newInvoice">New Invoice</span></button></div></div><div id="content"></div></main></div><div id="modal" class="modal hidden"><div id="modalBox" class="modalBox"></div></div><div id="toast" class="toast"></div><script>
const STORAGE='mld_pro_v2';const DEMO={invoices:[{customer:'ABC Cleaning',number:'INV-101',amount:8000,due:'2026-10-01',status:'unpaid',followup:'no',notes:'No follow-up recorded'},{customer:'Delta Auto',number:'INV-102',amount:4200,due:'2026-10-15',status:'unpaid',followup:'no',notes:'Second reminder required'},{customer:'Nova Services',number:'INV-103',amount:3500,due:'2026-12-01',status:'paid',followup:'yes',notes:'Paid'}],customers:[{name:'ABC Cleaning',phone:'+971 50 000 0001',email:'billing@abc-demo.com'},{name:'Delta Auto',phone:'+971 50 000 0002',email:'accounts@delta-demo.com'},{name:'Nova Services',phone:'+971 50 000 0003',email:'finance@nova-demo.com'}],expenses:[{supplier:'Supplier A',amount:3200,reference:2500,date:'2026-11-01',category:'Operations'},{supplier:'Supplier B',amount:1100,reference:1400,date:'2026-11-03',category:'Software'}]};let db=JSON.parse(localStorage.getItem(STORAGE)||'null')||JSON.parse(JSON.stringify(DEMO));let lang='en',currentPdfUrl=null,pdfBuffer=null;const T={en:{dashboard:'Dashboard',import:'Import / Upload',invoices:'Invoices',customers:'Customers',expenses:'Expenses',analysis:'Analysis',reports:'Reports',admin:'Administration',uploadFile:'Upload File',newInvoice:'New Invoice'},ar:{dashboard:'لوحة التحكم',import:'الرفع / الاستيراد',invoices:'الفواتير',customers:'العملاء',expenses:'المصروفات',analysis:'التحليل',reports:'التقارير',admin:'الإدارة',uploadFile:'رفع ملف',newInvoice:'فاتورة جديدة'}};function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}function money(n){return new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+' AED'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function overdue(x){return x.status!=='paid'&&x.due&&new Date(x.due+'T23:59:59')<new Date()}function health(){let u=db.invoices.filter(x=>x.status!=='paid'),od=u.filter(overdue),nf=u.filter(x=>x.followup!=='yes');return Math.max(0,100-Math.min(60,od.length*15)-Math.min(30,nf.length*7))}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.toastT);window.toastT=setTimeout(()=>e.style.display='none',2400)}function showPage(p){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const names=T[lang];document.getElementById('pageTitle').textContent=names[p]||p;const subs={dashboard:lang==='en'?'Find unpaid invoices, overdue amounts and financial leakage opportunities.':'اكتشف الفواتير غير المسددة والمتأخرة وفرص التسرب المالي.',import:lang==='en'?'Upload a file and get the result immediately.':'ارفع الملف وشاهد النتيجة مباشرة.',invoices:lang==='en'?'Manage every invoice from one place.':'إدارة كل الفواتير من مكان واحد.',customers:lang==='en'?'Customer records and payment follow-up.':'بيانات العملاء ومتابعة التحصيل.',expenses:lang==='en'?'Track expenses against reference values.':'تابع المصروفات مقارنة بالقيم المرجعية.',analysis:lang==='en'?'Prioritize what needs action first.':'رتّب الأمور التي تحتاج تدخلاً أولاً.',reports:lang==='en'?'Executive summary ready to print or save as PDF.':'ملخص تنفيذي جاهز للطباعة أو الحفظ PDF.',admin:lang==='en'?'Data backup, reset and system tools.':'النسخ الاحتياطي وإدارة النظام.'};document.getElementById('pageSub').textContent=subs[p]||'';const c=document.getElementById('content');if(p==='dashboard')c.innerHTML=dashboard();if(p==='import')c.innerHTML=importPage();if(p==='invoices')c.innerHTML=invoicesPage();if(p==='customers')c.innerHTML=customersPage();if(p==='expenses')c.innerHTML=expensesPage();if(p==='analysis')c.innerHTML=analysisPage();if(p==='reports')c.innerHTML=reportsPage();if(p==='admin')c.innerHTML=adminPage();if(p==='import')bindUploader();localizeUI()}document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.getElementById('langBtn').onclick=()=>{lang=lang==='en'?'ar':'en';document.body.classList.toggle('rtl',lang==='ar');document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[lang][e.dataset.i18n]||e.textContent);showPage(document.querySelector('.nav button.active')?.dataset.page||'dashboard')};document.body.classList.toggle('rtl',lang==='ar');document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[lang][e.dataset.i18n]||e.textContent);showPage(document.querySelector('.nav button.active')?.dataset.page||'dashboard');
function localizeUI(){if(lang!=='ar')return;const m={'Total Invoices':'إجمالي الفواتير','Unpaid':'غير المسدد','Overdue':'المتأخر','Health Score':'مؤشر الصحة','Health':'الحالة','Priority Alerts':'تنبيهات الأولوية','Quick Actions':'إجراءات سريعة','Recent Invoices':'أحدث الفواتير','View all':'عرض الكل','Upload data':'رفع البيانات','New invoice':'فاتورة جديدة','Open report':'فتح التقرير','Healthy':'جيد','Needs attention':'يحتاج متابعة','High risk':'مخاطر مرتفعة','Operational risk score':'مؤشر المخاطر التشغيلية','Collection Priority':'أولوية التحصيل','Follow-up Gaps':'فجوات المتابعة','Expense Anomalies':'ملاحظات المصروفات','No overdue invoices.':'لا توجد فواتير متأخرة.','All open invoices have follow-up.':'كل الفواتير المفتوحة تمت متابعتها.','No anomalies.':'لا توجد ملاحظات غير طبيعية.','Executive Report':'التقرير التنفيذي','Print / Save PDF':'طباعة / حفظ PDF','Total billed':'إجمالي الفواتير','Open balance':'الرصيد المفتوح','Recommended actions':'الإجراءات المقترحة','Backup':'النسخ الاحتياطي','CSV Template':'نموذج CSV','System':'النظام','Download Backup':'تنزيل النسخة الاحتياطية','Download Template':'تنزيل النموذج','Reset Demo Data':'إعادة بيانات التجربة','New Customer':'عميل جديد','New Expense':'مصروف جديد','Search invoices...':'البحث في الفواتير...','Customer':'العميل','Invoice':'الفاتورة','Amount':'المبلغ','Due Date':'تاريخ الاستحقاق','Status':'الحالة','Follow-up':'المتابعة','Paid':'مدفوع','Pending':'معلق','Open':'فتح','Name':'الاسم','Phone':'الهاتف','Email':'البريد الإلكتروني','Category':'التصنيف','Reference':'القيمة المرجعية','Variance':'الفرق','Date':'التاريخ','Notes':'ملاحظات','Save Invoice':'حفظ الفاتورة','Save Customer':'حفظ العميل','Save Expense':'حفظ المصروف','Mark as Paid':'تحديد كمدفوع','Mark Follow-up Done':'تسجيل المتابعة','Delete Invoice':'حذف الفاتورة','PDF Invoice Preview':'معاينة الفاتورة PDF','Extract Text / Data':'استخراج النص / البيانات','Open PDF':'فتح PDF','Choose File':'اختيار ملف'};document.querySelectorAll('#content h2,#content h3,#content button,#content th,#content .label').forEach(e=>{let k=e.textContent.trim();if(m[k])e.textContent=m[k]});document.querySelectorAll('#content input[placeholder]').forEach(e=>{if(e.placeholder==='Search invoices...')e.placeholder='البحث في الفواتير...'})}
function dashboard(){let total=db.invoices.reduce((a,x)=>a+Number(x.amount||0),0),un=db.invoices.filter(x=>x.status!=='paid'),od=un.filter(overdue),opp=od.reduce((a,x)=>a+Number(x.amount||0),0);return `<div class="grid4"><div class="card kpi"><div class="label">Total Invoices</div><div class="value">${money(total)}</div><div class="hint">${db.invoices.length} invoices</div></div><div class="card kpi"><div class="label">Unpaid</div><div class="value">${money(un.reduce((a,x)=>a+Number(x.amount||0),0))}</div><div class="hint">${un.length} open</div></div><div class="card kpi"><div class="label">Overdue</div><div class="value">${money(opp)}</div><div class="hint">${od.length} require action</div></div><div class="card kpi"><div class="label">Health Score</div><div class="value">${health()}/100</div><div class="hint">Operational risk score</div></div></div><div class="section grid3"><div class="card"><div class="sectionTitle"><h2>Health</h2></div><div class="score"><div class="scoreCircle" style="--score:${health()*3.6}deg"><b>${health()}</b></div><div><b>${health()>=80?'Healthy':health()>=55?'Needs attention':'High risk'}</b><p class="muted">Based on overdue and follow-up gaps.</p></div></div></div><div class="card"><h2>Priority Alerts</h2>${od.slice(0,3).map(x=>`<div class="alert danger">⚠ ${esc(x.customer)} — ${money(x.amount)}</div>`).join('')||'<div class="alert ok">✓ No overdue invoices.</div>'}</div><div class="card"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="showPage('import')">Upload data</button><button class="btn light" onclick="openInvoiceForm()">New invoice</button><button class="btn light" onclick="showPage('reports')">Open report</button></div></div></div><div class="section card"><div class="sectionTitle"><h2>Recent Invoices</h2><button class="btn light" onclick="showPage('invoices')">View all</button></div>${invoiceTable(db.invoices.slice().reverse().slice(0,6))}</div>`}function invoiceTable(a){if(!a.length)return '<div class="muted">No invoices yet.</div>';return `<div class="tableWrap"><table><thead><tr><th>Customer</th><th>Invoice</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Follow-up</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.number)}</td><td>${money(x.amount)}</td><td>${esc(x.due||'—')}</td><td><span class="badge ${x.status==='paid'?'paid':overdue(x)?'overdue':'unpaid'}">${x.status==='paid'?'Paid':overdue(x)?'Overdue':'Unpaid'}</span></td><td><span class="badge info">${x.followup==='yes'?'Done':'Pending'}</span></td><td><button class="btn light" onclick='openInvoice(${JSON.stringify(x)})'>Open</button></td></tr>`).join('')}</tbody></table></div>`}
function importPage(){return `<div class="card"><div class="drop" id="drop"><div class="big">⇧</div><h3>Click to choose a file</h3><p>CSV / JSON are imported automatically. PDF opens instantly for preview and text extraction.</p><input id="fileInput" type="file" accept=".csv,.json,.pdf,text/csv,application/json,application/pdf"><button id="chooseFile" class="btn">Choose File</button><div id="fileResult" class="fileResult"><div id="fileName"></div><div class="progress"><div id="bar" class="bar"></div></div></div></div><div class="section grid3"><div class="card"><b>CSV</b><p class="muted">Fast structured import.</p></div><div class="card"><b>JSON</b><p class="muted">Backup and structured import.</p></div><div class="card"><b>PDF</b><p class="muted">Preview + text extraction attempt.</p></div></div><div class="section actions"><button class="btn light" onclick="downloadSample()">Download CSV Template</button><button class="btn light" onclick="downloadJSON()">Download Backup</button></div></div>`}function bindUploader(){const d=document.getElementById('drop'),i=document.getElementById('fileInput'),b=document.getElementById('chooseFile');if(!d)return;b.onclick=e=>{e.stopPropagation();i.click()};d.onclick=e=>{if(e.target!==b)i.click()};i.onchange=e=>e.target.files[0]&&handleFile(e.target.files[0]);['dragenter','dragover'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>e.dataTransfer.files[0]&&handleFile(e.dataTransfer.files[0]));document.onpaste=e=>{const f=[...(e.clipboardData?.files||[])][0];if(f){showPage('import');handleFile(f)}}}async function handleFile(file){const r=document.getElementById('fileResult'),n=document.getElementById('fileName'),bar=document.getElementById('bar');if(r){r.style.display='block';n.textContent='Reading: '+file.name;bar.style.width='15%'}try{const ext=file.name.toLowerCase().split('.').pop();if(ext==='csv'){const rows=parseCSV(await file.text());bar.style.width='70%';const add=importRows(rows);save();bar.style.width='100%';toast(`${add.length} invoice(s) imported`);if(add[0])setTimeout(()=>openInvoice(add[0]),150);n.innerHTML=`<div class="alert ok">✓ Imported ${add.length} invoice(s) from <b>${esc(file.name)}</b>.</div>`}else if(ext==='json'){const o=JSON.parse(await file.text());const rows=Array.isArray(o)?o:(o.invoices||[]);bar.style.width='70%';const add=importRows(rows);save();bar.style.width='100%';toast(`${add.length} invoice(s) imported`);if(add[0])setTimeout(()=>openInvoice(add[0]),150);n.innerHTML=`<div class="alert ok">✓ Imported ${add.length} invoice(s) from <b>${esc(file.name)}</b>.</div>`}else if(ext==='pdf'){bar.style.width='55%';const url=URL.createObjectURL(file);currentPdfUrl=url;pdfBuffer=await file.arrayBuffer();showPdf(url,file);bar.style.width='100%';n.innerHTML=`<div class="alert ok">✓ PDF opened: <b>${esc(file.name)}</b></div>`}else throw Error('Unsupported file type')}catch(e){n.innerHTML=`<div class="alert danger">Could not import: ${esc(e.message)}</div>`;toast('Import failed')}}function parseCSV(s){s=s.replace(/^\uFEFF/,'');const lines=s.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const sep=lines[0].includes(';')?';':',';const h=splitCSV(lines[0],sep).map(x=>x.trim().toLowerCase());return lines.slice(1).map(l=>{const a=splitCSV(l,sep),o={};h.forEach((k,i)=>o[k]=a[i]??'');return o})}function splitCSV(s,sep){let o=[],c='',q=false;for(let i=0;i<s.length;i++){if(s[i]==='"'){if(q&&s[i+1]==='"'){c+='"';i++}else q=!q}else if(s[i]===sep&&!q){o.push(c);c=''}else c+=s[i]}o.push(c);return o}function importRows(rows){let add=[];rows.forEach((r,i)=>{let x={customer:r.customer||r.client||r['اسم العميل']||'Imported Customer',number:r.invoice_number||r.number||r.invoice||('IMP-'+Date.now()+'-'+i),amount:Number(String(r.amount||r.total||r['المبلغ']||0).replace(/[^0-9.-]/g,''))||0,due:r.due_date||r.due||r['تاريخ الاستحقاق']||'',status:['paid','مدفوع'].includes(String(r.status||'').toLowerCase())?'paid':'unpaid',followup:['yes','نعم','true'].includes(String(r.followup||'').toLowerCase())?'yes':'no',notes:r.notes||''};db.invoices.push(x);add.push(x)});return add}
function showPdf(url,file){modal(`<div class="modalHead"><div><h2>PDF Invoice Preview</h2><div class="muted">${esc(file.name)}</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="actions noPrint"><button class="btn" onclick="extractPdf()">Extract Text / Data</button><button class="btn light" onclick="window.open(currentPdfUrl,'_blank')">Open PDF</button></div><iframe class="preview" src="${url}" style="margin-top:12px"></iframe><div id="pdfOut" class="section"></div>`)}function extractPdf(){let u=new Uint8Array(pdfBuffer),s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);let a=[],m,re=/\(([^()]*)\)\s*Tj/g;while((m=re.exec(s)))a.push(m[1]);let t=a.join(' ').replace(/\\([()\\])/g,'$1');document.getElementById('pdfOut').innerHTML=t.trim().length>8?`<div class="alert ok">Text extracted successfully.</div><pre style="white-space:pre-wrap;background:#f7f9fc;padding:12px;border-radius:9px">${esc(t.slice(0,6000))}</pre>`:'<div class="alert">This PDF appears to be image/scanned. Automatic OCR is required to convert it into invoice fields.</div>'}
function invoicesPage(){return `<div class="card"><div class="toolbar"><h2>Invoices</h2><div class="actions"><input class="search" placeholder="Search invoices..." oninput="filterInvoices(this.value)"><button class="btn" onclick="openInvoiceForm()">+ New Invoice</button></div></div><div id="invoiceList">${invoiceTable(db.invoices)}</div></div>`}function filterInvoices(q){q=q.toLowerCase();document.getElementById('invoiceList').innerHTML=invoiceTable(db.invoices.filter(x=>JSON.stringify(x).toLowerCase().includes(q)))}function customersPage(){return `<div class="card"><div class="toolbar"><h2>Customers</h2><button class="btn" onclick="openCustomerForm()">+ New Customer</button></div><div class="section tableWrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Invoices</th></tr></thead><tbody>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${db.invoices.filter(x=>x.customer===c.name).length}</td></tr>`).join('')}</tbody></table></div></div>`}function expensesPage(){return `<div class="card"><div class="toolbar"><h2>Expenses</h2><button class="btn" onclick="openExpenseForm()">+ New Expense</button></div><div class="section tableWrap"><table><thead><tr><th>Supplier</th><th>Category</th><th>Amount</th><th>Reference</th><th>Variance</th><th>Date</th></tr></thead><tbody>${db.expenses.map(x=>`<tr><td>${esc(x.supplier)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${money(x.reference)}</td><td><span class="badge ${x.amount>x.reference?'overdue':'paid'}">${money(Number(x.amount)-Number(x.reference))}</span></td><td>${esc(x.date)}</td></tr>`).join('')}</tbody></table></div></div>`}function analysisPage(){let od=db.invoices.filter(overdue),nf=db.invoices.filter(x=>x.status!=='paid'&&x.followup!=='yes'),ex=db.expenses.filter(x=>Number(x.amount)>Number(x.reference));return `<div class="grid4"><div class="card kpi"><div class="label">Overdue invoices</div><div class="value">${od.length}</div></div><div class="card kpi"><div class="label">No follow-up</div><div class="value">${nf.length}</div></div><div class="card kpi"><div class="label">Expense anomalies</div><div class="value">${ex.length}</div></div><div class="card kpi"><div class="label">Health Score</div><div class="value">${health()}/100</div></div></div><div class="section grid3"><div class="card"><h2>Collection Priority</h2>${od.map(x=>`<div class="alert danger">⚠ ${esc(x.customer)} — ${money(x.amount)}<br><span class="muted">${esc(x.number)} due ${esc(x.due)}</span></div>`).join('')||'<div class="alert ok">No overdue invoices.</div>'}</div><div class="card"><h2>Follow-up Gaps</h2>${nf.map(x=>`<div class="alert">• ${esc(x.customer)} — ${esc(x.number)}</div>`).join('')||'<div class="alert ok">All open invoices have follow-up.</div>'}</div><div class="card"><h2>Expense Anomalies</h2>${ex.map(x=>`<div class="alert">⚠ ${esc(x.supplier)} — ${money(x.amount)} vs ${money(x.reference)}</div>`).join('')||'<div class="alert ok">No anomalies.</div>'}</div></div>`}function reportsPage(){let total=db.invoices.reduce((a,x)=>a+Number(x.amount||0),0),od=db.invoices.filter(overdue),open=db.invoices.filter(x=>x.status!=='paid');return `<div class="card"><div class="toolbar"><div><h2>Executive Report</h2><p class="muted">Generated from current local data.</p></div><button class="btn noPrint" onclick="window.print()">Print / Save PDF</button></div><div class="grid4 section"><div class="card kpi"><div class="label">Total billed</div><div class="value">${money(total)}</div></div><div class="card kpi"><div class="label">Open balance</div><div class="value">${money(open.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card kpi"><div class="label">Overdue</div><div class="value">${money(od.reduce((a,x)=>a+Number(x.amount||0),0))}</div></div><div class="card kpi"><div class="label">Health</div><div class="value">${health()}/100</div></div></div><div class="section"><h3>Recommended actions</h3><ol><li>Prioritize overdue invoices by value.</li><li>Record follow-up activity on every open invoice.</li><li>Review expenses above reference values.</li><li>Export a backup before major changes.</li></ol></div></div>`}function adminPage(){return `<div class="grid3"><div class="card"><h2>Backup</h2><p class="muted">Download all current data as JSON.</p><button class="btn" onclick="downloadJSON()">Download Backup</button></div><div class="card"><h2>CSV Template</h2><p class="muted">Use this structure for bulk invoice import.</p><button class="btn light" onclick="downloadSample()">Download Template</button></div><div class="card"><h2>System</h2><p class="muted">Local storage status: active.</p><button class="btn red" onclick="resetData()">Reset Demo Data</button></div></div>`}
function openInvoiceForm(){modal(`<div class="modalHead"><h2>New Invoice</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formGrid"><div class="field"><label>Customer</label><input id="fc"></div><div class="field"><label>Invoice Number</label><input id="fn"></div><div class="field"><label>Amount AED</label><input id="fa" type="number"></div><div class="field"><label>Due Date</label><input id="fd" type="date"></div><div class="field"><label>Status</label><select id="fs"><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select></div><div class="field"><label>Follow-up</label><select id="ff"><option value="no">Pending</option><option value="yes">Done</option></select></div></div><div class="field"><label>Notes</label><textarea id="fnotes"></textarea></div><button class="btn" onclick="saveInvoice()">Save Invoice</button>`)}function saveInvoice(){if(!fc.value||!fn.value)return toast('Customer and invoice number are required');db.invoices.push({customer:fc.value,number:fn.value,amount:Number(fa.value||0),due:fd.value,status:fs.value,followup:ff.value,notes:fnotes.value});save();closeModal();showPage('invoices');toast('Invoice saved')}function openCustomerForm(){modal(`<div class="modalHead"><h2>New Customer</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formGrid"><div class="field"><label>Name</label><input id="cn"></div><div class="field"><label>Phone</label><input id="cp"></div><div class="field"><label>Email</label><input id="ce"></div></div><button class="btn" onclick="saveCustomer()">Save Customer</button>`)}function saveCustomer(){if(!cn.value)return toast('Name required');db.customers.push({name:cn.value,phone:cp.value,email:ce.value});save();closeModal();showPage('customers')}function openExpenseForm(){modal(`<div class="modalHead"><h2>New Expense</h2><button class="close" onclick="closeModal()">✕</button></div><div class="formGrid"><div class="field"><label>Supplier</label><input id="es"></div><div class="field"><label>Category</label><input id="ec"></div><div class="field"><label>Amount AED</label><input id="ea" type="number"></div><div class="field"><label>Reference AED</label><input id="er" type="number"></div><div class="field"><label>Date</label><input id="ed" type="date"></div></div><button class="btn" onclick="saveExpense()">Save Expense</button>`)}function saveExpense(){db.expenses.push({supplier:es.value,category:ec.value,amount:Number(ea.value||0),reference:Number(er.value||0),date:ed.value});save();closeModal();showPage('expenses')}function openInvoice(x){modal(`<div class="modalHead"><div><h2>Invoice: ${esc(x.number)}</h2><div class="muted">${esc(x.customer)}</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="detailGrid"><div class="card"><div class="kv"><div><small>Amount</small><b>${money(x.amount)}</b></div><div><small>Due Date</small><b>${esc(x.due||'—')}</b></div><div><small>Status</small><b>${x.status}</b></div><div><small>Follow-up</small><b>${x.followup}</b></div></div><div class="section"><small class="muted">Notes</small><p>${esc(x.notes||'No notes')}</p></div></div><div class="card"><h3>Quick Actions</h3><div class="actions" style="flex-direction:column"><button class="btn green" onclick="markPaid('${x.number}')">Mark as Paid</button><button class="btn light" onclick="markFollowup('${x.number}')">Mark Follow-up Done</button><button class="btn red" onclick="deleteInvoice('${x.number}')">Delete Invoice</button></div></div></div>`)}function markPaid(n){let i=db.invoices.find(x=>x.number===n);if(i){i.status='paid';save();closeModal();showPage('dashboard');toast('Marked as paid')}}function markFollowup(n){let i=db.invoices.find(x=>x.number===n);if(i){i.followup='yes';save();closeModal();showPage('dashboard');toast('Follow-up updated')}}function deleteInvoice(n){db.invoices=db.invoices.filter(x=>x.number!==n);save();closeModal();showPage('dashboard');toast('Invoice deleted')}function modal(html){const m=document.getElementById('modal'),b=document.getElementById('modalBox');b.innerHTML=html;m.classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function downloadJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='money-leak-backup.json';a.click()}function downloadSample(){const c='customer,invoice_number,amount,due_date,status,followup,notes\n"Alpha LLC","INV-201",5400,"2026-11-30","unpaid","no","Regular client"\n"Beta Co","INV-202",3200,"2026-10-10","unpaid","no","Delayed payment"';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='invoices-template.csv';a.click()}function resetData(){if(confirm('Reset all demo data?')){db=JSON.parse(JSON.stringify(DEMO));save();showPage('dashboard');toast('Data reset')}}
</script></body></html>
